services:
  spark-explorer:
    build: .
    image: spark-explorer:latest
    container_name: spark-explorer
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Mqtt__Transport: "Tcp"
      Mqtt__Host: "mosquitto"
      Mqtt__Port: "1883"
      Mqtt__WebSocketUri: "ws://mosquitto:9001"
      Mqtt__Subscriptions: "#,$$SYS/#,spBv1.0/#"
    restart: unless-stopped
