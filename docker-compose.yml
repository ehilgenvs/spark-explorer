# Spark Explorer + a Mosquitto broker (MQTT over TCP and WebSocket).
#
# Standalone: this file is all you need. The app is built straight from GitHub
# and the broker configuration is included below.
#
#   docker compose up -d --build
#   open http://localhost:8080
#
# To rebuild after new commits are pushed:
#   docker compose build --no-cache spark-explorer && docker compose up -d
#
# Requires Docker Compose v2.23.1 or newer (for the inline broker config).

services:
  spark-explorer:
    build:
      # Builds the main branch of the GitHub repository using its Dockerfile.
      # Pin a tag or commit instead of "main" for repeatable builds, e.g. ...spark-explorer.git#v1.0
      context: https://github.com/ehilgenvs/spark-explorer.git#main
    image: spark-explorer:latest
    container_name: spark-explorer
    ports:
      - "8080:8080"            # web UI
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Defaults shown in the connection bar (see the "Mqtt" section of appsettings.json)
      Mqtt__Transport: Tcp      # Tcp or WebSocket
      Mqtt__Host: mosquitto     # the bundled broker; use host.docker.internal for a broker on this machine
      Mqtt__Port: "1883"
      Mqtt__WebSocketUri: ws://mosquitto:9001
      Mqtt__Subscriptions: "#, $$SYS/#"   # $$ escapes $ in compose files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    ports:
      - "1883:1883"            # MQTT over TCP
      - "9001:9001"            # MQTT over WebSocket
    configs:
      - source: mosquitto-conf
        target: /mosquitto/config/mosquitto.conf
    volumes:
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

configs:
  mosquitto-conf:
    # Anonymous access is fine for local testing, not for a network you don't control.
    # To require logins, set allow_anonymous false and add a password_file.
    content: |
      persistence true
      persistence_location /mosquitto/data/

      listener 1883
      protocol mqtt

      listener 9001
      protocol websockets

      allow_anonymous true

volumes:
  mosquitto-data:
