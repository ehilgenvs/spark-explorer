services:
  spark-explorer:
    build: .
    image: spark-explorer:latest
    container_name: spark-explorer
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Mqtt__Transport: "Tcp"
      Mqtt__Host: "mosquitto"
      Mqtt__Port: "1883"
      Mqtt__WebSocketUri: "ws://mosquitto:9001"
      Mqtt__Subscriptions: "#,$$SYS/#"
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - mosquitto-data:/mosquitto/data:Z
    restart: unless-stopped

volumes:
  mosquitto-data:
